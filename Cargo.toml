[package]
name = "vinyl-f20"
version = "0.1.0"
edition = "2024"
description = "The vinyl music player as firmware for the Surfans F20 (runs on the player's Linux via the Rockbox hosted bootloader)"
publish = false

# The player itself lives in external/vinyl (a git submodule that is used
# untouched): src/main.rs pulls its modules in by path, and src/f20 supplies
# the parts a pocket player needs instead of a terminal: a framebuffer
# backend for ratatui, the buttons and wheel, hardware volume and power.
[[bin]]
name = "vinyl-f20"
path = "src/main.rs"

[dependencies]
# Same versions as external/vinyl/Cargo.toml, so its sources compile as-is.
anyhow = "1.0.104"
dirs = "7.0.0"
libc = "0.2"
lofty = "0.25.5"
ratatui = "0.30.2"
rodio = { version = "0.23.0", features = ["symphonia-all"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkdir = "2.5.0"

[target.'cfg(target_os = "linux")'.dependencies]
# Mixer controls on the player (DAC volume, headphone/line-out switch).
# The same alsa-lib cpal already links for playback, so nothing extra.
alsa = "0.11"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
