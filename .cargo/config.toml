# Cross build for the F20 (tools/build.sh): zig as the C compiler and linker,
# and pkg-config pointed at the static alsa-lib from tools/build-alsa.sh. The
# target name is the stem of tools/mipsel-f20.json. Native `cargo test` and
# `cargo run` on the desktop are unaffected.
[target.mipsel-f20]
linker = "tools/zig-cc"
# One static binary: musl and alsa-lib linked in, nothing from the player.
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-self-contained=no"]

[env]
PKG_CONFIG_ALLOW_CROSS = "1"
PKG_CONFIG_ALL_STATIC = "1"
PKG_CONFIG_PATH_mipsel_f20 = { value = "build/alsa/lib/pkgconfig", relative = true }
CC_mipsel_f20 = { value = "tools/zig-cc", relative = true }
AR_mipsel_f20 = { value = "tools/zig-ar", relative = true }
