# Surfans F20 settings for vinyl (key = value). vinyl's own settings live in
# the `config` file next to this one.

# Bitmap font: 5x8 (64x30 cells), 6x12 (53x20 cells) or 8x16 (40x15 cells).
font = 6x12

# The kernel reports the Prev/Next buttons the other way round from their
# labels on some units (Rockbox notes the same). Set to true if yours are swapped.
swap_prev_next = false

# Seconds without a button press before the backlight goes off; 0 keeps it on.
screen_timeout = 30

# Starting volume, 0-100, if nothing has been saved yet.
volume = 50

# Use the ALSA mixer for volume and headphone/line-out routing. Set to
# false to leave the DAC alone (volume keys then do nothing).
mixer = true

# DAC output port selector ("Output Port Switch", 0-5). auto follows the
# headphone/line-out jack switches as Rockbox does (2 = headphones, 1 = line
# out). While the player runs, Menu + wheel steps it live and shows the value.
port = auto
